name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so new advisories against unchanged dependencies still show up
  schedule:
    - cron: '0 15 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json is gitignored in this repo, so `npm ci` isn't available
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Fails on high or critical advisories; moderate and low ones are listed
      # but don't fail the build (e.g. the minimatch copy bundled inside
      # aws-cdk-lib, which only an aws-cdk-lib release can update)
      - name: Audit dependencies
        run: npm run audit

      # Workspace packages are consumed via their dist/ output, so build first
      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run type-check

      # Hermetic tests only; the live avalanche.org suites run locally with `npm test`
      - name: Unit tests
        run: npm run test:unit
